name: G0 one-time lockfile update and test formatting

on:
  push:
    branches:
      - feat/living-atlas-v3

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/living-atlas-v3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Root install and format precise tests
        run: |
          npm ci
          npx prettier --write tests/portfolio.spec.ts experiments/camera-spike/package.json experiments/camera-spike/tsconfig.json .github/workflows/g0-lock2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/portfolio.spec.ts experiments/camera-spike/package.json experiments/camera-spike/tsconfig.json .github/workflows/g0-lock2.yml
          git diff --cached --quiet || git commit -m 'style(g0): format scoped assertions and type fix'
      - name: Update isolated npm lock and validate spike build
        working-directory: experiments/camera-spike
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build
          npm run test:unit
      - name: Commit lock and push
        run: |
          git add -- experiments/camera-spike/package-lock.json
          git diff --cached --quiet || git commit -m 'build(g0): lock explicit Node type dependencies'
          npm run format:check
          git push origin HEAD:feat/living-atlas-v3
