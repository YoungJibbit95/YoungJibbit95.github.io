name: G0 one-time strict source formatting and smoke build

on:
  push:
    branches:
      - feat/living-atlas-v3

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/living-atlas-v3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible root install
        run: npm ci
      - name: Format only changed source and test files
        run: |
          npx prettier --write tests/portfolio.spec.ts src/components/NexusStory.tsx experiments/camera-spike/src/CameraRig.tsx experiments/camera-spike/src/cameraTypes.ts experiments/camera-spike/src/SpikeApp.tsx experiments/camera-spike/e2e/camera.spec.ts .github/workflows/g0-source-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/portfolio.spec.ts src/components/NexusStory.tsx experiments/camera-spike/src/CameraRig.tsx experiments/camera-spike/src/cameraTypes.ts experiments/camera-spike/src/SpikeApp.tsx experiments/camera-spike/e2e/camera.spec.ts .github/workflows/g0-source-format.yml
          git diff --cached --quiet || git commit -m 'style(g0): apply canonical Prettier to targeted camera and regression fixes'
      - name: Verify both deterministic builds
        run: |
          npm run format:check
          npm run build
          cd experiments/camera-spike
          npm ci
          npm run build
          npm run test:unit
      - name: Push formatted fixes to existing branch
        run: git push origin HEAD:feat/living-atlas-v3
