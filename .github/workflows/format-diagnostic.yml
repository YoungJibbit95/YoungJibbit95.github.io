name: Temporary format diagnosis
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show deterministic prettier diff
        run: |
          npx prettier --write experiments/camera-spike/src/cameraModel.ts
          git --no-pager diff -- experiments/camera-spike/src/cameraModel.ts
