name: Verify and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact G1 Prettier differences (read-only diagnostic)
        run: |
          for file in docs/experience/G1_ARCHITECTURE.md playwright.config.ts src/experience/CameraRig.tsx src/experience/experience.css src/experience/ExperienceRoot.tsx src/experience/SceneDirector.ts src/experience/SceneRegistry.ts src/experience/WorldCanvas.tsx src/experience/worlds/OriginPreview.tsx src/experience/worldTypes.ts src/store/worldHistory.ts tests/experience.spec.ts tests/experience.unit.test.ts; do
            echo "G1-FORMAT-START:${file}"
            npx prettier "${file}" | diff -u "${file}" - || true
            echo "G1-FORMAT-END:${file}"
          done
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Save G1 preview screenshots and traces
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: g1-preview-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
