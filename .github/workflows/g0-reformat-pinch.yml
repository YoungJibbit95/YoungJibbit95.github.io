name: G0 one-time exact Prettier fix for camera E2E

on:
  push:
    branches:
      - feat/living-atlas-v3

permissions:
  contents: write

jobs:
  fix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/living-atlas-v3
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format and commit only browser test differences
        run: |
          npx prettier --write experiments/camera-spike/e2e/camera.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- experiments/camera-spike/e2e/camera.spec.ts
          git diff --cached --quiet || git commit -m 'style(g0): canonical Prettier for keyboard and pinch browser tests'
      - name: Verify and push formatting
        run: |
          npm run format:check
          git push origin HEAD:feat/living-atlas-v3
